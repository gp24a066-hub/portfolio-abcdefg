<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e4">
  <meta name="description" content="メンバーそれぞれの個性と制作物を紹介するポートフォリオサイトです。">
  <title>Our Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-shell" id="top">
    <header class="site-header">
      <a class="wordmark" href="#top" aria-label="ポートフォリオ ホーム">our<span>.</span>portfolio</a>
      <nav class="site-nav" aria-label="メインナビゲーション">
        <a href="#works" id="nav-works" hidden>WORKS</a>
        <a href="#members">MEMBERS</a>
      </nav>
    </header>

    <main>
      <section class="hero" aria-labelledby="intro-title">
        <div class="hero-content">
          <p class="eyebrow">Our creators / Portfolio</p>
          <h1 id="intro-title">それぞれの個性が、<br><span>ひとつの形になる。</span></h1>
          <p class="hero-copy">
            <span id="member-count">メンバー</span>それぞれの個性を紹介するポートフォリオです。
          </p>
          <a class="text-link" href="#members">VIEW OUR MEMBERS <span aria-hidden="true">↘</span></a>
        </div>
        <div class="portrait-card" id="portrait-card" role="img" aria-label="メンバーが並んだプロフィールビジュアル">
          <!-- members/ のデータから自動で並びます -->
          <div class="hero-lineup" id="hero-lineup" aria-hidden="true"></div>
          <p class="portrait-note">OUR LINEUP / 2026</p>
        </div>
      </section>

      <!-- 制作実績：誰かの works に作品が入ると自動で表示されます -->
      <section class="section" id="works" aria-labelledby="works-title" hidden>
        <div class="section-heading">
          <p class="eyebrow">01 / Works</p>
          <div>
            <h2 id="works-title">制作実績</h2>
          </div>
        </div>
        <div class="works-list" id="works-list"></div>
      </section>

      <section class="section" id="members" aria-labelledby="members-title">
        <div class="section-heading">
          <p class="eyebrow">02 / Members</p>
          <div>
            <h2 id="members-title">メンバー紹介</h2>
          </div>
        </div>
        <!-- members/ のデータから自動でカードが作られます -->
        <div class="members-grid" id="members-grid"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>© 2026 OUR PORTFOLIO</p>
      <a class="back-to-top" href="#top">BACK TO TOP ↑</a>
    </footer>
  </div>

  <script src="members/_list.js"></script>
  <script src="main.js"></script>
</body>
</html>
